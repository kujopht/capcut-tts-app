# CI toi thieu cho nen tang web (`server/` + `web/`).
#
# KHONG can secret nao. Backend chay o che do mac dinh `DATA_BACKEND=mock` va
# `STORAGE_BACKEND=local`, khong co `server/.env` nen khong cham toi Appwrite hay
# R2. Da xac minh: 521 test dat khi `FAS_ENV_FILE` tro vao mot file rong.
#
# Ung dung desktop (`app.py`, `desktop_app/`, `capcut_tts_api/`) KHONG chay o day:
# no can PySide6 va mot man hinh, con cai dat PySide6 tren CI se pha vo dung dieu
# ma job `backend` phai chung minh — rang `server/requirements.txt` la du.

name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  # Cho phep production-deploy.yml tai su dung CHINH XAC cac job nay lam
  # cong required test gate truoc khi deploy that, thay vi chep lai logic
  # test — khong doi hanh vi cua ba trigger o tren, chi THEM mot duong goi
  # nua vao CUNG workflow nay.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Push moi huy lan chay cu cua cung branch — khong xep hang vo ich.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Quet bi mat (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Quet toan bo lich su cua RIENG lan push/PR nay (khong phai toan bo
      # repo moi lan chay) bang cau hinh o .gitleaks.toml — lop mac dinh cua
      # gitleaks cong them quy tac rieng cho dinh dang khoa Appwrite
      # (standard_<hex dai> / console_<hex dai>). Xem su co 2026-08-16/08-20
      # trong docs/reports/preprod-security-audit.md.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  backend:
    name: Backend tests (moi truong sach)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Runner la mot may sach, va day la venv rieng ngoai cay lam viec: khong co
      # goi nao co san tu truoc, nen day dong thoi la phep thu
      # "server/requirements.txt co du de chay backend hay khong".
      - name: Tao venv ngoai cay lam viec
        run: python -m venv "$RUNNER_TEMP/venv"

      - name: Cai dat CHI tu server/requirements.txt
        run: |
          PY="$RUNNER_TEMP/venv/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r server/requirements.txt

      # Backend web KHONG duoc keo theo GUI. Neu mot ngay nao do co ai them
      # `import PySide6` vao `server/`, phep thu nay do ngay.
      - name: Xac nhan khong keo theo PySide6
        run: |
          if "$RUNNER_TEMP/venv/bin/python" -m pip list --format=freeze \
               | grep -Ei '^(PySide6|shiboken6)'; then
            echo "::error::server/requirements.txt da keo theo PySide6"
            exit 1
          fi
          echo "khong co PySide6 / shiboken6"

      # Chung minh runtime TU NO da du: import duoc ca ung dung khi trong venv
      # moi co dung `requirements.txt`. Buoc nay phai chay TRUOC khi cai bat ky
      # goi test nao, neu khong no khong con chung minh dieu gi.
      - name: Import ung dung chi voi phu thuoc runtime
        env:
          PYTHONPATH: ""
        run: |
          "$RUNNER_TEMP/venv/bin/python" -c "import server.main, server.worker; print('import OK')"

      # Cong cu chi danh cho test. Tach rieng de khong lam ban tap phu thuoc
      # runtime ma buoc tren vua kiem.
      - name: Cai phu thuoc chi danh cho test
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r server/requirements-dev.txt

      # PYTHONPATH de rong co y: neu can dat thu cong thi cach chay da sai.
      - name: Chay server/tests
        env:
          PYTHONPATH: ""
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s server/tests -t . -v

      # scripts/tests/ da ton tai tu truoc (vd test_setup_appwrite_readiness.py)
      # nhung chua bao gio duoc CI THAT SU chay — buoc "Bien dich" ben duoi chi
      # kiem tra cu phap, khong chay assertion nao. Them buoc nay de cac test
      # thuan (khong cham mang/Appwrite that, xem tung tep) that su duoc kiem.
      - name: Chay scripts/tests
        env:
          PYTHONPATH: ""
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s scripts/tests -t . -v

      - name: Bien dich toan bo ma backend
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m compileall -q server scripts

  web:
    name: Web tests, TypeScript, ESLint, production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` chu khong `npm install`: khoa dung phien ban trong
      # package-lock.json, nen CI khong bao gio chay tren mot cay khac may.
      - name: Cai dat phu thuoc
        run: npm ci

      - name: Web tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      # `NEXT_PUBLIC_API_BASE` co gia tri du phong trong `src/lib/api.ts`, nen
      # build khong can bien nao. Chi la URL localhost — khong phai secret.
      - name: Production build
        run: npx next build
