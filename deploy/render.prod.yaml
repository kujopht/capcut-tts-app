# Blueprint PRODUCTION trên Render — CHỈ backend API.
#
# Blueprint Path khi nhập trên Render:  deploy/render.prod.yaml
#
# KHÔNG CÓ GIÁ TRỊ SECRET NÀO TRONG TỆP NÀY. `sync: false` nghĩa là Render sẽ
# hỏi giá trị ở giao diện và giữ trong kho secret của nó, không bao giờ vào git.
#
# ============================================================================
#  KIẾN TRÚC — ba nơi, ba nhà cung cấp, $0
# ============================================================================
#
#      Cloudflare Workers (Free)          ← frontend Next.js qua OpenNext
#              │  HTTPS
#              ▼
#      Render Free Web Service            ← CHỈ dịch vụ này nằm trong tệp này
#              │
#              ▼
#      Appwrite production + R2 fanfic-prod
#              ▲
#              │ claim job
#      TTS worker trên LAPTOP             ← không phải Render
#
#  Staging tách hoàn toàn: project Appwrite khác, bucket R2 khác, worker khác.
#
# ============================================================================
#  VÌ SAO CHỈ CÒN MỘT SERVICE
# ============================================================================
#
#  Bản trước của tệp này khai ba service `plan: starter` (~$21/tháng). Không cần:
#
#  * **Frontend** → Cloudflare Workers Free. Next.js chạy qua
#    `@opennextjs/cloudflare`. Xem `web/wrangler.jsonc` và `deploy/RUNBOOK-PRODUCTION.md`.
#
#  * **Worker TTS** → laptop, dùng `server/.env.production`. Gói Free của Render
#    không có Background Worker, và MVP chấp nhận việc audio chỉ được tạo khi
#    laptop bật.
#
#  * **API** → Render Free. Đánh đổi đã biết và chấp nhận: service **ngủ sau 15
#    phút** không có traffic, request đầu tiên sau đó mất khoảng 50 giây.
#
#  ⚠️ HỆ QUẢ CỦA API NGỦ, cần biết trước để khỏi tưởng là lỗi: **tạo** job cần
#  API thức (`POST /api/jobs` đi qua nó). Nhưng job đã nằm trong hàng đợi thì
#  worker laptop nói chuyện thẳng với Appwrite — API ngủ **không** làm dừng job
#  đang chạy.
#
# ============================================================================
#  BLUEPRINT VỚI MỘT SERVICE — hoàn toàn hợp lệ
# ============================================================================
#
#  Render không đòi Blueprint phải có nhiều service; danh sách một phần tử là
#  hợp lệ. Nếu vì lý do nào đó bạn muốn tạo tay thay vì dùng Blueprint, mục 4
#  của `deploy/RUNBOOK-PRODUCTION.md` có đủ từng ô cần điền.
#
# ============================================================================

services:
  - type: web
    name: fas-prod-api
    runtime: python
    plan: free
    region: singapore        # cùng vùng với Appwrite sgp
    branch: main
    autoDeploy: false        # deploy có chủ ý, không theo mọi lần push
    buildCommand: pip install -r server/requirements.txt
    startCommand: python -m uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health      # LIVENESS — không chạm Appwrite/R2
    envVars:
      - key: FAS_ENV
        value: production
      # BẮT BUỘC. `Settings.validate()` dừng ngay nếu môi trường thật mà web
      # vẫn tự chạy job. Gói Free lại càng không được: service ngủ giữa chừng
      # sẽ giết job đang tổng hợp.
      - key: FAS_INLINE_WORKER
        value: "false"
      - key: DATA_BACKEND
        value: appwrite
      - key: STORAGE_BACKEND
        value: r2
      # --- chính sách giọng: giữ đúng cấu hình hiện có -------------------
      # Chuỗi RỖNG = không phục vụ giọng chạy cục bộ nào. Khác hẳn "không đặt"
      # (không đặt thì mặc định là `piper:ngochuyen`).
      #
      # Ngọc Huyền hiện TẮT trên production. Bật lại sau khi worker laptop
      # hoặc Modal được nghiệm thu — đổi biến này, không phải sửa mã.
      #
      # XÁC MINH SAU DEPLOY: `GET /api/health` phải trả `"local_voices": []`.
      # Nếu Render bỏ qua biến rỗng thì nó sẽ trả `["piper:ngochuyen"]`; khi đó
      # đặt giá trị `none` (id ngoài bộ NghiTTS bị loại ở vòng lọc thứ hai nên
      # kết quả vẫn rỗng).
      - key: FAS_LOCAL_VOICES
        value: ""
      - key: FAS_PUBLIC_VOICE_LANGUAGES
        value: vi
      # --- định danh và secret: hỏi ở giao diện --------------------------
      # URL Worker trên Cloudflare, ví dụ https://fanfic-web.<tài-khoản>.workers.dev
      # Sau khi gắn fanfic.world thì thêm origin đó vào, cách nhau bằng dấu phẩy.
      # TUYỆT ĐỐI không dùng "*": backend gửi kèm credentials, và
      # `Settings.validate()` sẽ dừng ngay.
      - key: FAS_CORS_ORIGINS
        sync: false
      - key: APPWRITE_ENDPOINT
        sync: false
      - key: APPWRITE_PROJECT_ID
        sync: false          # PROJECT PRODUCTION, không phải staging
      - key: APPWRITE_DATABASE_ID
        sync: false
      - key: APPWRITE_API_KEY
        sync: false          # SECRET
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false          # fanfic-prod, không phải bucket staging
      - key: R2_ACCESS_KEY_ID
        sync: false          # SECRET
      - key: R2_SECRET_ACCESS_KEY
        sync: false          # SECRET

# ----------------------------------------------------------------------------
# KHÔNG có `type: worker` và KHÔNG có service frontend ở đây — đó là chủ ý, xem
# phần đầu tệp.
#
# CHƯA GẮN fanfic.world. Dùng *.onrender.com và *.workers.dev trước; gắn tên
# miền sau khi nghiệm thu. Khi gắn thì phải cập nhật CẢ `FAS_CORS_ORIGINS` (ở
# đây) LẪN `NEXT_PUBLIC_API_BASE` (lúc build frontend), rồi BUILD LẠI frontend —
# `NEXT_PUBLIC_*` được nướng vào bundle lúc build, không đọc lúc chạy.
#
# RECONCILER: chạy tay theo `deploy/reconcile-cron.md`, chế độ CHỈ ĐỌC. Gói Free
# không có Cron Job, và tuyệt đối không bật chế độ xoá tự động trên production.
