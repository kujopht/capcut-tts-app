<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 40" width="240" height="40">
  <title>Fanfic Audio Studio</title>
  <style>
    /* Chu lay mau theo nen: mot file dung duoc ca nen sang lan nen toi */
    .word { fill: #0b0d12; }
    .word-sub { fill: #6f7b91; }
    @media (prefers-color-scheme: dark) {
      .word { fill: #e9edf5; }
      .word-sub { fill: #a8b2c5; }
    }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#4dd6c1"/>
    </linearGradient>
  </defs>

  <g transform="translate(0 4)">
    <rect width="32" height="32" rx="9" fill="url(#g)"/>
    <g transform="translate(4.81 5.12) scale(0.7)" fill="#0b0d12" stroke="#0b0d12" stroke-linejoin="round">
      <rect x="8.4" y="9.2" width="3.2" height="4.4" rx="1.6" stroke="none"/>
      <rect x="14.4" y="3.4" width="3.2" height="10.2" rx="1.6" stroke="none"/>
      <rect x="20.4" y="7.2" width="3.2" height="6.4" rx="1.6" stroke="none"/>
      <path d="M4.6 16.4 14.6 18 14.6 26.8 4.6 25.2Z" stroke-width="1.8"/>
      <path d="M27.4 16.4 17.4 18 17.4 26.8 27.4 25.2Z" stroke-width="1.8"/>
    </g>
  </g>

  <text x="42" y="26" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif"
        font-size="17" font-weight="700" letter-spacing="-0.4">
    <tspan class="word">Fanfic</tspan><tspan class="word-sub" dx="5">Audio Studio</tspan>
  </text>
</svg>
